<!DOCTYPE html>
<html lang="pt-BR" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html">

<h:head>
    <title>Introdução a EJB</title>
</h:head>
<h:body>
    <h2>Hello from Facelets</h2>
    <p>
        A data e hora do EJB é:
        <h:outputText value="#{controleDataHora.beanDataHora.dataHoraServidor}"/>
    </p>

    <h1><h:outputLabel value="#{controleDataHora.nomeUsuario}"/></h1>

    <h:form>
        Usuario: <h:inputText value="#{controleUsuario.beanUsuario.usuario}"/>
        <h:commandButton action="#{controleUsuario.informaUsuario}" value="Informe o usuario" />
    </h:form>
</h:body>
</html>
